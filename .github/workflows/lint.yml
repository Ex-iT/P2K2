name: lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Setup pnpm + Node.js 🏗
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Run linter 👀
        run: pnpm run lint
